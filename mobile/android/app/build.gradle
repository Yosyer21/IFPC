plugins {
    id 'com.android.application'
}

android {
    namespace 'com.futureballer.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.futureballer.app'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
        // Punto de entrada de la app: directo al login (el landing no se muestra).
        buildConfigField 'String', 'APP_URL', '"https://futureballler.up.railway.app/login"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            // Distribución directa (fuera de Play Store): se firma con la clave
            // de debug para que el APK sea instalable sin gestionar un keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
